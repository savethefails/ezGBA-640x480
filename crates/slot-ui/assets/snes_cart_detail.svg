<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172">
  <!-- The moulding of the North American Game Pak: the grooves across both wings with a screw
       at the foot of each, the edges of the centre column, and the recessed grip below the label
       with its centre tab. The label wraps over the top edge, so it has no wall above it; its
       recess is cut by `cart::recess_label`. Black is shadow and white is light, from the upper
       left, as for every cart; see `silhouette::rasterise_detail`. -->
  <g stroke-width="1.3" stroke-linecap="round">
    <g stroke="#000">
      <path d="M2 34 H20 M2 61.5 H20 M2 89 H20 M2 116.5 H20 M2 144 H20"/>
      <path d="M220 34 H238 M220 61.5 H238 M220 89 H238 M220 116.5 H238 M220 144 H238"/>
      <path d="M218.5 7 V171"/>
      <path d="M32 106 H208 M32.5 106 V172"/>
      <path d="M142 107 V152 L139 158"/>
    </g>
    <g stroke="#fff">
      <path d="M2 35.4 H20 M2 62.9 H20 M2 90.4 H20 M2 117.9 H20 M2 145.4 H20"/>
      <path d="M220 35.4 H238 M220 62.9 H238 M220 90.4 H238 M220 117.9 H238 M220 145.4 H238"/>
      <path d="M21.5 7 V171"/>
      <path d="M207.5 107 V172"/>
      <path d="M98 107 V152 L101 158"/>
    </g>
  </g>
  <g>
