<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172">
  <!-- The moulding of the SNES Game Pak: the grip ridges running across the top, above the
       label. Black is the shadow side of each ridge and white the side that catches the light;
       see `silhouette::rasterise_detail`. -->
  <g stroke-width="1.6" stroke-linecap="round">
    <g stroke="#000">
      <line x1="34" y1="10" x2="206" y2="10"/>
      <line x1="30" y1="18" x2="210" y2="18"/>
      <line x1="30" y1="26" x2="210" y2="26"/>
      <line x1="30" y1="34" x2="210" y2="34"/>
      <line x1="30" y1="42" x2="210" y2="42"/>
    </g>
    <g stroke="#fff">
      <line x1="34" y1="12" x2="206" y2="12"/>
      <line x1="30" y1="20" x2="210" y2="20"/>
      <line x1="30" y1="28" x2="210" y2="28"/>
      <line x1="30" y1="36" x2="210" y2="36"/>
      <line x1="30" y1="44" x2="210" y2="44"/>
    </g>
  </g>
</svg>
