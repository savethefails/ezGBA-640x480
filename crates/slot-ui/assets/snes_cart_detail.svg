<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172">
  <!-- The moulding of the North American Game Pak. Its label wraps over the top edge, so the
       face has no band of plastic above it: what there is to see is the lip below the label and
       the rounded long edges. Black is shadow and white is light, from the upper left, as for
       every cart; see `silhouette::rasterise_detail`. -->
  <g stroke-width="1.4" stroke-linecap="round">
    <g stroke="#000">
      <line x1="14" y1="149" x2="226" y2="149"/>
      <line x1="237" y1="8" x2="237" y2="164"/>
    </g>
    <g stroke="#fff">
      <line x1="14" y1="151" x2="226" y2="151"/>
      <line x1="3" y1="8" x2="3" y2="164"/>
    </g>
  </g>
</svg>
