    <path d="M44 2 H56 V16 H70 V28 H56 V42 H44 V28 H30 V16 H44 Z"/>
    <circle cx="50" cy="61" r="7"/>
    <circle cx="65" cy="76" r="7"/>
    <circle cx="35" cy="76" r="7"/>
    <circle cx="50" cy="91" r="7"/>
  </g>
</svg>
