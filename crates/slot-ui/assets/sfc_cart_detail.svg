<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172">
  <!-- The moulding of the Super Famicom and PAL Game Pak: grip ridges across the band above the
       label, held clear of the rounded corners, and the rounded long edges. Black is the shadow
       side of each feature and white the side that catches the light. -->
  <g stroke-width="1.6" stroke-linecap="round">
    <g stroke="#000">
      <line x1="40" y1="11" x2="200" y2="11"/>
      <line x1="34" y1="19" x2="206" y2="19"/>
      <line x1="30" y1="27" x2="210" y2="27"/>
      <line x1="30" y1="35" x2="210" y2="35"/>
      <line x1="30" y1="43" x2="210" y2="43"/>
    </g>
    <g stroke="#fff">
      <line x1="40" y1="13" x2="200" y2="13"/>
      <line x1="34" y1="21" x2="206" y2="21"/>
      <line x1="30" y1="29" x2="210" y2="29"/>
      <line x1="30" y1="37" x2="210" y2="37"/>
      <line x1="30" y1="45" x2="210" y2="45"/>
    </g>
  </g>
  <g stroke-width="1.4" stroke-linecap="round">
    <line x1="237" y1="26" x2="237" y2="164" stroke="#000"/>
    <line x1="3" y1="26" x2="3" y2="164" stroke="#fff"/>
  </g>
</svg>
