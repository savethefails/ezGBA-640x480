<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <!-- A PICO-8 cart, which has no real plastic: ezGBA's own faux cartridge, built round the
       picture PICO-8 prints on every .p8.png. As wide as the other carts, so the row keeps its
       width, and tall enough for the cart's picture at one and a half pixels for one, its title
       under it and its pins. The top left corner is cut away, as on the cart PICO-8 draws around a .p8.png;
       the other corners are rounded off. -->
  <path d="M20 0 H230 Q240 0 240 10 V270 Q240 280 230 280 H10 Q0 280 0 270 V20 Z" fill="#fff"/>
</svg>
