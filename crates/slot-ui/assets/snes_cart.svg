<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 172">
  <!-- The North American SNES Game Pak seen square on, label to the front: the boxy shell,
       squared off where the Super Famicom's is rounded, with only a small chamfer at the top
       corners and a small radius at the bottom ones. Drawn in the same 240 x 172 box ezGBA has
       always used for a SNES cart; see `sfc_cart.svg` for the Japanese and PAL shell. -->
  <path d="M5 0 H235 L240 5 V165 Q240 172 233 172 H7 Q0 172 0 165 V5 Z" fill="#fff"/>
