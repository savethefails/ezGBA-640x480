<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 196">
  <!-- The faux PICO-8 cart's moulding: four short grip ridges each side of the label, the way a
       cartridge is gripped to pull it out. Black is the shadow side of each ridge and white the
       side that catches the light; see `silhouette::rasterise_detail`. -->
  <g stroke-width="1.6" stroke-linecap="round">
    <g stroke="#000">
      <line x1="16" y1="70" x2="40" y2="70"/>
      <line x1="16" y1="80" x2="40" y2="80"/>
      <line x1="16" y1="90" x2="40" y2="90"/>
      <line x1="16" y1="100" x2="40" y2="100"/>
      <line x1="200" y1="70" x2="224" y2="70"/>
      <line x1="200" y1="80" x2="224" y2="80"/>
      <line x1="200" y1="90" x2="224" y2="90"/>
      <line x1="200" y1="100" x2="224" y2="100"/>
    </g>
    <g stroke="#fff">
      <line x1="16" y1="72" x2="40" y2="72"/>
      <line x1="16" y1="82" x2="40" y2="82"/>
      <line x1="16" y1="92" x2="40" y2="92"/>
      <line x1="16" y1="102" x2="40" y2="102"/>
      <line x1="200" y1="72" x2="224" y2="72"/>
      <line x1="200" y1="82" x2="224" y2="82"/>
      <line x1="200" y1="92" x2="224" y2="92"/>
      <line x1="200" y1="102" x2="224" y2="102"/>
    </g>
  </g>
</svg>
