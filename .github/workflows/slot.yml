name: slot

# Only System/slot, for updating a card that is already set up: the cores and licences on it
# have not changed, so rebuilding mGBA and fetching gpSP again is a wait for nothing. Runs on
# every push that touches the code, so the binary for a branch's latest commit is always
# waiting, and by hand from the Actions tab. `release` still builds the whole card tree.
on:
  push:
    branches: ['**']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/slot.yml'
      - 'cores/snes9x2005/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: System/slot
    # The same box and image as `release`, so this binary is the one a release would ship:
    # native arm64, linked against bullseye's glibc 2.31.
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      # A branch name can hold a `/`, which an artifact's name cannot.
      - name: Name the artifact
        run: |
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "NAME=slot-$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')-$short" >> "$GITHUB_ENV"

      # The registry and the build directory, keyed on the lockfile. A code change then
      # recompiles only the workspace's own crates rather than every dependency.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target-device
          key: slot-device-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: slot-device-

      # What `task build:device` runs, without installing Task for one command.
      - name: Build
        run: |
          cargo build --profile device --target-dir target-device \
            -p slot --no-default-features --features device

      # A binary built for the wrong machine does not start, and the card shows nothing.
      - name: Check it is for the device
        run: file target-device/device/slot | grep -q aarch64

      # The bare file, not a System folder around it: copied as a folder, a Mac's Replace would
      # delete the System folder on the card first, and the cores with it.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: target-device/device/slot
          if-no-files-found: error

  # The snes9x2005_plus core run-ahead is being tried on, which no card has yet: it goes into
  # System/ beside slot, and its licence and source into System/licenses.
  snes9x2005:
    name: System/snes9x2005_plus_libretro.so
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Name the artifact
        run: |
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "NAME=snes9x2005-$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')-$short" >> "$GITHUB_ENV"

      - name: Build
        run: |
          commit="$(sed -n 's/^  SNES9X2005_COMMIT: //p' taskfile.yml)"
          sh cores/snes9x2005/build.sh build "$commit" target-device/snes9x2005 out/snes9x2005_plus_libretro.so
          file out/snes9x2005_plus_libretro.so | grep -q aarch64
          mkdir -p out/licenses
          mv out/snes9x2005_plus_libretro.so.LICENSE out/licenses/snes9x2005-LICENSE.txt
          mv out/snes9x2005_plus_libretro.so.meta "out/licenses/snes9x2005-$commit.meta"
          mv out/snes9x2005_plus_libretro.so.src.tar.gz "out/licenses/snes9x2005-$commit.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: out/
          if-no-files-found: error
